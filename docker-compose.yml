services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/recipe_aggregator
      # Local development only — generate a real one for anything deployed:
      # python -c "import secrets; print(secrets.token_urlsafe(32))"
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-not-for-production-use}

volumes:
  mongo_data:
